name: frontend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/src/studyrun/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      # pnpm/action-setup inspects the repo root, so packageManager in
      # frontend/package.json is not picked up.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Export backend openapi.json
        working-directory: backend
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python -c "from studyrun.main import app; import json; json.dump(app.openapi(), open('openapi.json','w'))"

      - name: Generate API schema
        run: pnpm gen:api

      - name: Check schema drift
        run: git diff --exit-code src/lib/api/schema.d.ts

      - name: Type check
        run: pnpm check

      - name: Unit + component tests
        run: pnpm test

      - name: Build
        run: pnpm build

  image:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'release'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Derive image version (strip leading v)
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/studyrun-frontend:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/studyrun-frontend:latest
