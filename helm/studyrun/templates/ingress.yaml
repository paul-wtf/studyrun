{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "studyrun.fullname" . }}
  labels:
    {{- include "studyrun.labels" . | nindent 4 }}
  annotations:
    {{- if not (hasKey .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-body-size") }}
    nginx.ingress.kubernetes.io/proxy-body-size: "{{ .Values.config.uploadMaxMegabytes }}m"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "studyrun.fullname" . }}-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "studyrun.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
