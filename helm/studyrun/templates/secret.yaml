{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "studyrun.fullname" . }}
  labels:
    {{- include "studyrun.labels" . | nindent 4 }}
type: Opaque
stringData:
  STUDYRUN_DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  STUDYRUN_ANTHROPIC_API_KEY: {{ required "secrets.anthropicApiKey is required" .Values.secrets.anthropicApiKey | quote }}
{{- end }}
